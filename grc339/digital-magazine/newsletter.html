<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <link rel="stylesheet" type="text/css" href="style.css">
      <link rel="stylesheet" href="https://use.typekit.net/kbc1jfm.css">
      <link rel="stylesheet" href="https://use.typekit.net/kbc1jfm.css">
      <title>On the Menu</title>
      <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
      <meta http-equiv="Pragma" content="no-cache" />
      <meta http-equiv="Expires" content="0" />
   </head>
   <body>
      <div class="container">
         <header>
            <h1>
               <a href="index.html"><img src="logo.svg" alt="super cute logo"/></a>
            </h1>
            <nav>
               <ul>
                  <li>
                     <a href="#">Recipes</a>
                  </li>
                  <li>
                     <a href="#">Hosting</a>
                  </li>
                  <li>
                     <a href="#">Tablescapes</a>
                  </li>
                  <li>
                     <a href="#">Entertaining</a>
                  </li>
                  <li>
                     <a href="#">Lifestyle</a>
                  </li>
               </ul>
            </nav>
         </header>
         <main>
            <form>
              <section class="image">
                <h2>Subscribe to our newsletter!</h2>
                <figure><img src="gallery1.jpg" alt="Candlelit dinner with movie in background"></figure>
              </section>
              <section class="personal-info">
                <h3>Personal Information</h3>
                <ul>
                  <li><label for="name">Name:</label><input type="text" name="name" id="name" placeholder="your full name"></li>
                  <li><label for="email">Email:</label><input type="email" name="email" id="email" placeholder="confirmation email"></li>
                </ul>
              </section>
              <section class="interests">
                <h3>Select Your interests</h3>
                <ul>
                  <li><input type="checkbox" id="recipes" value="recipes"><label for="recipes">Recipes</label></li>
                  <li><input type="checkbox" id="hosting-tips" value="hosting-tips"><label for="hosting-tips">Hosting tips</label></li>
                  <li><input type="checkbox" id="tablescape-ideas" value="tablescape-ideas"><label for="tablescape-ideas">Tablescape ideas</label></li>
                  <li><input type="checkbox" id="entertaining" value="entertaining"><label for="entertaining">Entertaining</label></li>
                  <li><input type="checkbox" id="lifestyle" value="lifestyle"><label for="lifestyle">Lifestyle</label></li>
                </ul>
              </section>
              <section class="subscribe"><button type="subscribe">Subscribe</button></section>
            </form>
          </main>
         <footer>
            <p>All rights reserved.</p>
         </footer>
      </div>
   </body>
</html>
