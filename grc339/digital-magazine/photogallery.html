<!doctype html>
<html lang="en">

   <body>
      <div class="container">
         <header>
            <h1>
               <a href="index.html"><img src="logo.svg" alt="On the Menu."/></a>

            <nav>

            <section class="gallery-stage">

               <figure>

               </figure>
               <figure>
                  <img src="gallery3.jpg" alt="Name placeholders." />
]               </figure>

                  <img src="gallery4.jpg" alt="Appetizers on a tray." />
               </figure>
               <figure>
                  <img src="gallery5.jpg" alt="Colorful menus." />

               <figure>
                  <img src="gallery6.jpg" alt="Colorful cocktails." />
               </figure>
               <figure>
                  <img src="gallery7.jpg" alt="Appetizers on a tray." />
               </figure>
               <figure>
                  <img src="gallery8.jpg" alt="Table with multiple dishes." />
               </figure>

            <nav class="gallery-nav">
               <label for="photo1">

                  <img src="gallery2.jpg" alt="Outdoor garden dinner table." />

               </label>
               <label for="photo4">
                  <img src="gallery4.jpg" alt="Appetizers on a tray." />

                  <img src="gallery6.jpg" alt="Colorful cocktails." />
               </label>
